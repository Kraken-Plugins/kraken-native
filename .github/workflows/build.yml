# Tests the API and client, builds kraken_hook.dll and packages Kraken for Windows on every push and pull request.
# Pushing a tag such as v0.2.0 also publishes those files as a GitHub release. docs/developer/releasing.md has the steps.
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push replaces a branch's or pull request's running build; a tag's build always finishes
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package
    # The DLL needs Visual Studio's C++ tools and the installer WiX Toolset 3; this image has both
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Pick the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Release tags look like v1.2.3 or v1.2.3-beta.1, not $GITHUB_REF_NAME"
              exit 1
            fi
          else
            version="$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')"
          fi
          echo "Version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Put WiX on PATH
        shell: pwsh
        run: if ($env:WIX) { Join-Path $env:WIX 'bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }

      # gradlew.bat, since the checkout gives the gradlew shell script Windows line endings
      - name: Test, build and package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew.bat build :client:packageRelease "-Pversion=$env:VERSION"

      - name: Upload the release files
        uses: actions/upload-artifact@v7
        with:
          name: kraken-${{ steps.version.outputs.version }}-windows-x64
          path: client/build/release/
          if-no-files-found: error
          # The zip and the installer are compressed already
          compression-level: 0
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            api/build/reports/tests/
            client/build/reports/tests/
          if-no-files-found: ignore

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: kraken-${{ needs.build.outputs.version }}-windows-x64
          path: release

      - name: Write the checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          games="$(find api/src/main/resources/mappings -name '*.json' -printf '%f\n' | sed 's/\.json$//' | sort -V | paste -sd ' ' | sed 's/ /, /g')"
          docs="https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs"
          cat > notes.md <<EOF
          ## Download

          - **Kraken-$VERSION-windows-x64-setup.exe** installs Kraken for your Windows account, with Start menu and desktop shortcuts.
          - **Kraken-$VERSION-windows-x64.zip** is the same app without installing: unzip it anywhere and run **Kraken\\Kraken.exe**.

          Both carry their own Java, so there's nothing else to install. Old School RuneScape must be installed through the Jagex Launcher.
          Windows may warn that the app comes from an unknown publisher, since it isn't signed: choose **More info**, then **Run anyway**.

          Game versions this release can read: $games. [Using the client]($docs/client.md) covers launch options, and
          [Logging in with a Jagex account]($docs/jagex-accounts.md) covers logging in.

          **kraken-api-$VERSION.jar** is the API on its own, and **SHA256SUMS.txt** lists the files' checksums.

          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            flags=()
            if [[ "$VERSION" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" release/* --verify-tag --title "Kraken $VERSION" --notes-file notes.md \
              --generate-notes "${flags[@]}"
          fi
