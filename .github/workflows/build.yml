# Tests the API and client, builds kraken_hook.dll and packages Kraken for Windows on every push and pull request.
# Every push to master is also released: the version comes from version.txt and the release tags, the commit is tagged
# v<version>, and the GitHub release carries the files, install steps and the commits since the last release.
# docs/developer/releasing.md has the details.
name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push replaces a branch's or pull request's running build. master's runs go one at a time, so each release
  # sees the tag of the one before it
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  version:
    name: Pick the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      # The whole history, for the release tags
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the version
        id: version
        env:
          RELEASE: ${{ github.ref == 'refs/heads/master' }}
        run: bash .github/scripts/release-version.sh >> "$GITHUB_OUTPUT"

  build:
    name: Test and package
    needs: version
    # The DLL needs Visual Studio's C++ tools and the installer WiX Toolset 3; this image has both
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Put WiX on PATH
        shell: pwsh
        run: if ($env:WIX) { Join-Path $env:WIX 'bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }

      # gradlew.bat, since the checkout gives the gradlew shell script Windows line endings
      - name: Test, build and package
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./gradlew.bat build :client:packageRelease "-Pversion=$env:VERSION"

      - name: Upload the release files
        uses: actions/upload-artifact@v7
        with:
          name: kraken-${{ needs.version.outputs.version }}-windows-x64
          path: client/build/release/
          if-no-files-found: error
          # The zip and the installer are compressed already
          compression-level: 0
          retention-days: 14

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            api/build/reports/tests/
            client/build/reports/tests/
          if-no-files-found: ignore

  release:
    name: Publish the release
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The whole history, for the commits since the last release
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: kraken-${{ needs.version.outputs.version }}-windows-x64
          path: release

      - name: Write the checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Write the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bash .github/scripts/release-notes.sh "$VERSION" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      # gh release create uploads the files to a draft, then publishes it, which tags the built commit. A draft for the
      # tag is what an attempt that died uploading leaves behind, so it is deleted first. A run for a commit that is
      # already released replaces that release's files and notes instead
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          drafts="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id")"
          for id in $drafts; do
            echo "Deleting the draft release $id left for $TAG"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

          tagged="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)"
          if [[ -n "$tagged" && "$tagged" != "$GITHUB_SHA" ]]; then
            echo "::error::$TAG is already released from $tagged; run the workflow for the newest master commit instead"
            exit 1
          fi

          if [[ -n "$tagged" ]] && gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "Kraken $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "Kraken $VERSION" --notes-file notes.md
          fi
