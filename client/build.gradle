plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // The RuneLite-shaped native API this client embeds dev tools for
    implementation project(':api')

    implementation 'net.java.dev.jna:jna-platform:5.14.0'
    implementation 'com.formdev:flatlaf:3.5.4'
    implementation 'com.formdev:flatlaf-fonts-jetbrains-mono:2.304'
    implementation 'org.kordamp.ikonli:ikonli-swing:12.3.1'
    implementation 'org.kordamp.ikonli:ikonli-materialdesign2-pack:12.3.1'
    // Dependency injection: the injector builds and wires the frame, its panels and the game launcher
    implementation 'com.google.inject:guice:7.0.0'
    // Finds the built-in plugins (@PluginDescriptor classes under com.kraken.client.plugins)
    implementation 'io.github.classgraph:classgraph:4.8.180'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    // The plugin tests build no Swing components; keep AWT from looking for a display
    systemProperty 'java.awt.headless', 'true'
}

tasks.withType(JavaExec).configureEach {
    systemProperties = System.properties
}

// The injected native event hook (client/src/main/native/kraken_hook). Its DLL is compiled from C++ by build.ps1 and
// staged into a generated resources directory so the jar bundles it as native/kraken_hook.dll, which NativeEventServer
// extracts and injects at runtime. processResources depends on the build below, so every client jar (and :client:run)
// carries a current DLL. compileNativeHook is incremental - it re-runs only when the C++ source or build.ps1 changes -
// and needs a C++ toolchain on PATH (see client/src/main/native/kraken_hook/README.md).
def nativeHookDir = layout.projectDirectory.dir('src/main/native/kraken_hook')
def nativeHookDll = nativeHookDir.file('kraken_hook.dll')
def nativeHookResources = layout.buildDirectory.dir('generated-resources/native-hook')

tasks.register('compileNativeHook', Exec) {
    description = 'Compiles kraken_hook.dll from its C++ source via build.ps1 (needs a C++ toolchain).'
    group = 'build'
    workingDir nativeHookDir.asFile
    commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'build.ps1'
    inputs.file(nativeHookDir.file('kraken_hook.cpp'))
    inputs.file(nativeHookDir.file('build.ps1'))
    outputs.file(nativeHookDll)
}

tasks.register('buildNativeHook', Copy) {
    description = 'Builds kraken_hook.dll and stages it into the client resources (bundled into the jar as native/kraken_hook.dll).'
    group = 'build'
    dependsOn 'compileNativeHook'
    from nativeHookDll
    into nativeHookResources.map { it.dir('native') }
}

sourceSets.main.resources.srcDir(nativeHookResources)

tasks.named('processResources') {
    dependsOn 'buildNativeHook'
}

application {
    mainClass = 'com.kraken.client.KrakenClient'
}
