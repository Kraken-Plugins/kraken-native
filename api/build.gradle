plugins {
    id 'java-library'
}

group = 'com.kraken'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Reading the client's memory (Kernel32.ReadProcessMemory) and parsing mappings/<version>.json
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Gameval sources: com.kraken.api.gameval is a copy of RuneLite's net.runelite.api.gameval, written by
// ./gradlew :api:generateGameval. Run it by hand when the cache revision moves; it is not part of the build.
// The default pins runelite/runelite "Update GameVals to 2026-10-14-rev241", the gameval update for client rev 241.
// Override with -PgamevalCommit=<sha>.
def gamevalDefaultCommit = '4baec1bd46db1e3b42c6902dbdf85d686d40f394'

tasks.register('generateGameval') {
    group = 'kraken'
    description = 'Regenerates com.kraken.api.gameval from runelite/runelite at -PgamevalCommit (run by hand, not part of the build)'

    def commit = providers.gradleProperty('gamevalCommit').getOrElse(gamevalDefaultCommit)
    def rawBase = "https://raw.githubusercontent.com/runelite/runelite/${commit}"
    def srcDir = 'runelite-api/src/main/java/net/runelite/api/gameval'
    def outDir = layout.projectDirectory.dir('src/main/java/com/kraken/api/gameval').asFile

    doLast {
        def fetch = { String url ->
            def conn = new URL(url).openConnection()
            conn.setRequestProperty('User-Agent', 'kraken-generateGameval')
            conn.connectTimeout = 15000
            conn.readTimeout = 30000
            conn.inputStream.getText('UTF-8')
        }

        def listing = new groovy.json.JsonSlurper().parseText(
                fetch("https://api.github.com/repos/runelite/runelite/contents/${srcDir}?ref=${commit}"))
        def names = listing.findAll { it.type == 'file' && it.name.endsWith('.java') }*.name.sort()
        if (names.isEmpty()) {
            throw new GradleException("No gameval .java files listed for runelite/runelite ${commit}")
        }

        def license = fetch("${rawBase}/LICENSE").replace('\r\n', '\n').trim()
        if (license.contains('*/')) {
            throw new GradleException('LICENSE contains "*/" and cannot be embedded in a block comment')
        }
        def licenseLines = license.split('\n').collect { it.trim().isEmpty() ? ' *' : ' * ' + it.stripTrailing() }
                .join('\n')

        outDir.mkdirs()
        def written = []
        names.each { name ->
            def src = fetch("${rawBase}/${srcDir}/${name}").replace('\r\n', '\n')
            def renamed = src.replace('package net.runelite.api.gameval;', 'package com.kraken.api.gameval;')
            if (!renamed.contains('package com.kraken.api.gameval;')) {
                throw new GradleException("${name}: package line not found, cannot rename")
            }
            def leftovers = renamed.readLines().findAll { it.contains('net.runelite') }
            if (!leftovers.isEmpty()) {
                throw new GradleException("${name}: net.runelite reference left after rename: ${leftovers}")
            }
            def header = """/*
${licenseLines}
 *
 * Generated by ./gradlew :api:generateGameval from runelite/runelite commit ${commit}
 * (runelite-api/src/main/java/net/runelite/api/gameval/${name}), with the package renamed to
 * com.kraken.api.gameval. Do not edit.
 */
"""
            new File(outDir, name).write(header + renamed, 'UTF-8')
            written << name
        }

        outDir.listFiles().findAll { it.isFile() && it.name.endsWith('.java') && !written.contains(it.name) }.each {
            logger.lifecycle("Deleting ${it.name}, not produced by this run")
            it.delete()
        }
        logger.lifecycle("Wrote ${written.size()} gameval files from runelite/runelite ${commit} into ${outDir}")
    }
}
