  - key: events.ON_NPC_OP
    type: hook
    priority: P2
    strategies:
      - extractor: { name: event_raisers, field: events.ON_NPC_OP, cls: A }
  - key: events.ON_LOC_OP
    type: hook
    priority: P2
    strategies:
