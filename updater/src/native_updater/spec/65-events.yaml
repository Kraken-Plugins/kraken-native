# Native event hook sites, for the client module's injected hook DLL (client/src/main/native/kraken_hook): the
# functions the client calls to raise each `osrs.Events` id (`enums.events`), plus two plain hook targets. Hooking a
# raiser's entry sees every raise, before the Lua-plugins gate. See events.py for the recipe.
#
# An events.<NAME> value is a list of hook sites, one per raiser of that event:
#   { fn: <rva>, idArg: 0, args: N }   the raiser takes the event id in RCX (N register args in all, RCX included)
#   { fn: <rva>, id: <event id>, args: N }   the raiser is specific to this event
# The DLL detours fn, forwards N integer register arguments and reports (id, args) to the Java side; what the
# arguments mean per event is the Lua event contract (docs/event-hooks-design.md).
keys:
  - key: functions.dispatchEvent
    type: "bool(int eventId)"
    priority: P1
    doc: The no-payload raiser (`MOV ECX, id; CALL`), called at the server tick with ON_GAME_TICK. Kept for the game-tick hook; events.ON_GAME_TICK carries the same site.
    strategies:
      - extractor: { name: event_raisers, field: functions.dispatchEvent, cls: A }
  - key: Client.pluginGate
    type: ptr
    priority: P2
    doc: The optional plugin-manager slot every raiser tests before firing; null means Lua plugins are off and no event reaches Lua (hooks still see the raise).
    strategies:
      - extractor: { name: event_raisers, field: Client.pluginGate, cls: A }
  - key: functions.clientCycle
    type: "void(Client*)"
    priority: P1
    doc: The client cycle (Client vtable slot), the function incrementing global.cycle. Entry hook for ClientTick.
    strategies:
      - extractor: { name: cycle_function, field: CycleFunction, cls: A }
  - key: functions.setGameState
    type: "void(Client*, int state)"
    priority: P1
    doc: Writes Client.gameState (old state readable at entry, new in EDX). Entry hook for GameStateChanged on every change; the Lua event only fires for login-flow triggers.
    strategies:
      - extractor: { name: game_state_setter, field: GameStateSetter, cls: A }

  # Immediate raises (sol2 call on the spot).
  - key: events.ON_GAME_TICK
    type: hook
    priority: P1
    doc: Server tick, right after Client.tickCount increments. No payload.
    strategies:
      - extractor: { name: event_raisers, field: events.ON_GAME_TICK, cls: A }
    invariants:
      - first_fn_equals: functions.dispatchEvent
  - key: events.ON_SCREEN_RESIZE
    type: hook
    priority: P2
    doc: Raised by the Client's periodic size check (vtable slot), not only on a change. No payload.
    strategies:
      - extractor: { name: event_raisers, field: events.ON_SCREEN_RESIZE, cls: A }
  - key: events.ON_DIALOG_ABORT
    type: hook
    priority: P2
    strategies:
      - extractor: { name: event_raisers, field: events.ON_DIALOG_ABORT, cls: A }
  - key: events.ON_MINIMENU_REBUILD
    type: hook
    priority: P2
    strategies:
      - extractor: { name: event_raisers, field: events.ON_MINIMENU_REBUILD, cls: A }
  - key: events.ON_GAME_STATE_CHANGED
    type: hook
    priority: P1
    doc: args RCX (unused), RDX -> int GameStateTrigger (enums.gameStateTrigger). Raised from the login packet path and the state setter for a few transitions only.
    strategies:
      - extractor: { name: event_raisers, field: events.ON_GAME_STATE_CHANGED, cls: A }
  - key: events.ON_NPC_LOAD
    type: hook
    priority: P1
    doc: NPC added to the scene. args RCX id, RDX -> char* NPC name, R8 -> int (NPC type id << 16 | slot).
    strategies:
      - extractor: { name: event_raisers, field: events.ON_NPC_LOAD, cls: A }
  - key: events.ON_NPC_UNLOAD
    type: hook
    priority: P1
    doc: NPC removed from the scene; same raiser and arguments as ON_NPC_LOAD.
    strategies:
      - extractor: { name: event_raisers, field: events.ON_NPC_UNLOAD, cls: A }
  - key: events.ON_LOC_LOAD
    type: hook
    priority: P1
    doc: Loc added to a tile. args RCX (unused), RDX -> packed coord, R8 -> char* LocType name, R9 -> byte.
    strategies:
      - extractor: { name: event_raisers, field: events.ON_LOC_LOAD, cls: A }
  - key: events.ON_LOC_UNLOAD
    type: hook
    priority: P1
    doc: Loc removed from a tile; same arguments as ON_LOC_LOAD.
    strategies:
      - extractor: { name: event_raisers, field: events.ON_LOC_UNLOAD, cls: A }
  - key: events.ON_VARBIT_UPDATE
    type: hook
    priority: P1
    doc: A varbit the client tracks changed. args RCX id, RDX -> {int varbitId, int oldValue}, R8 -> int newValue.
    strategies:
      - extractor: { name: event_raisers, field: events.ON_VARBIT_UPDATE, cls: A }
  - key: events.ON_IF_LOAD
    type: hook
    priority: P2
    doc: Interface group loaded. args RCX (unused), RDX -> int group id, R8 -> int.
    strategies:
      - extractor: { name: event_raisers, field: events.ON_IF_LOAD, cls: A }
  - key: events.ON_CLIENTSCRIPT
    type: hook
    priority: P2
    strategies:
      - extractor: { name: event_raisers, field: events.ON_CLIENTSCRIPT, cls: A }
  - key: events.ON_TARGET_ENTER
    type: hook
    priority: P2
    strategies:
