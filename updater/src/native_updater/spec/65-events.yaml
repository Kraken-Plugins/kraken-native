  # Deferred raises: the transmit wrappers only mark the event pending; the client fires it to Lua later. The
  # payload is in the client's transmit state, not in the arguments.
  - key: events.ON_VAR_TRANSMIT
    type: hook
    priority: P1
    doc: Varps arrived from the server (the var transmit ring holds which). Re-read vars on receipt.
    strategies:
      - extractor: { name: event_raisers, field: events.ON_VAR_TRANSMIT, cls: A }
  - key: events.ON_INV_TRANSMIT
    type: hook
    priority: P1
    doc: An inventory arrived from the server. Re-read item containers on receipt.
    strategies:
