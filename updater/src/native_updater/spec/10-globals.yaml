keys:
  - key: global.client
    type: ptr<Client>
    priority: P0
    live: clientRoot
    doc: The Client singleton slot. Every ClientOp handler starts by loading it.
    strategies:
      - global-load: { in: "ClientOp.*", size: ptr }
      - getter: { in: { string: "Invalid NPC ID passed to npc_coord." }, kind: global, size: ptr, select: { nth: 0 } }

  - key: global.cycle
    type: i32
    priority: P0
    live: cycle
    doc: Client cycle counter (20 ms units); passed to the headbar lookup in isHeadbarEmpty.
    strategies:
      - getter: { in: osrs.Entity.isHeadbarEmpty, kind: global, size: i32, select: { passed_to: { arg: 2 } } }

  - key: global.varps
    type: ptr<i32[]>
    priority: P0
    live: varps
    strategies:
      - getter: { in: ClientState.getVarp, kind: global, size: ptr, select: { used_as_index_base: true } }

  - key: global.varpsBits
    type: ptr<i32[]>
    priority: P0
    live: varbits
    doc: The varp array the varbit reader indexes (differs from global.varps; verify live which is server-side).
    strategies:
      - getter: { in: "@VarbitRead", kind: global, size: ptr, select: { used_as_index_base: true } }

  - key: global.varpCount
    type: i32
    priority: P1
    doc: Number of varps (the file count of config group 16); every varp array, global.varps included, has this many
      entries. The bound of the login-time varp reset loop.
    strategies:
      - getter: { in: "@VarpReset", kind: global, size: i32, select: { used_in_cmp: true } }

  - key: global.varbitMaskTable
    type: i32[32]
    priority: P0
    live: varbits
    doc: mask[n] = 2^(n+1) - 1, indexed by msb - lsb.
    strategies:
      - getter: { in: "@VarbitRead", kind: global_addr, size: i32, select: { indexed: true, index_scale: 4 } }

  - key: global.configCache
    type: ptr
    priority: P1
    doc: First argument of every config loader call (a pointer held in a global, or the object itself).
    strategies:
      - getter: { in: "@ConfigLoader.9", kind: global, select: { passed_to: { fn: "@ConfigLoaderCore", arg: 0 } } }
      - getter: { in: "@ConfigLoader.9", kind: global_addr, select: { passed_to: { fn: "@ConfigLoaderCore", arg: 0 } } }

  # Camera control state: a byte that isControlled returns, and the follow target that hasTarget compares with -1.
  - key: global.cameraControlled
    type: u8
    priority: P1
    doc: Returned by Camera.isControlled; Camera.setControl writes it.
    strategies:
      - getter: { in: Camera.isControlled, kind: global, load: u8, select: { returned: true } }
  - key: global.cameraTarget
    type: i32
    priority: P1
    doc: Camera follow target; -1 when there is none (Camera.hasTarget compares it with -1, clearTarget writes -1).
    strategies:
      - getter: { in: Camera.hasTarget, kind: global, load: i32, select: { compared_with: -1 } }
