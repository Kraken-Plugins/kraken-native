keys:
  # Container contracts, re-derived every build so the API can traverse EASTL structures safely.
  - key: container.hash_map.buckets
    type: const
    priority: P0
    live: hashMap
    strategies:
      - extractor: { name: shared_layouts, field: container.hash_map.buckets, cls: A }
  - key: container.hash_map.bucketCount
    type: const
    priority: P0
    live: hashMap
    strategies:
      - extractor: { name: shared_layouts, field: container.hash_map.bucketCount, cls: A }
  - key: container.hash_map.node.key
    type: const
    priority: P0
    live: hashMap
    strategies:
      - hash-map: { in: "@NpcLookup", base: node_value, part: node_key }
  - key: container.hash_map.node.value
    type: const
    priority: P0
    live: hashMap
    strategies:
      - hash-map: { in: "@NpcLookup", base: node_value, part: node_value }
  - key: container.hash_map.node.next
    type: const
    priority: P0
    live: hashMap
    strategies:
      - hash-map: { in: "@NpcLookup", base: node_value, part: node_next }
  - key: container.shared_ptr.ptr
    type: const
    priority: P0
    live: hashMap
    strategies:
      - extractor: { name: shared_layouts, field: container.shared_ptr.ptr, cls: A }
  - key: container.shared_ptr.ctrl.useCount
    internal: true
    type: const
    priority: P1
    strategies:
      - extractor: { name: shared_layouts, field: container.shared_ptr.ctrl.useCount, cls: A }
  - key: container.list.node.next
    type: const
    priority: P1
    doc: The next-node pointer of an eastl::list node; the headbar walk compares it with the list's sentinel.
    strategies:
      - getter: { in: osrs.Entity.isHealthbarRendered, base: { field: { of: sp_result, key: Actor.headbars } }, load: ptr, select: { used_in_cmp: true } }
  - key: container.list.node.prev
    type: const
    priority: P1
    doc: The previous-node pointer; the head-bar update lookup steps back to the last update that has started.
    strategies:
      - getter: { in: "@HeadbarUpdate", base: { field: { of: any, key: container.list.node.next } }, load: ptr, select: { stored_to: { arg: 1, offset: 8 } } }
  - key: container.list.node.value
    type: const
    priority: P0
    live: headbars
    doc: Offset of the element pointer inside an eastl::list node (observed in the headbar walk).
    strategies:
      - extractor: { name: shared_layouts, field: container.list.node.value, cls: A }
  - key: container.string.size
    type: const
    priority: P0
    live: localPlayerName
    strategies:
      - extractor: { name: string_sso, in: ClientOp.npcCoord, field: container.string.size, cls: A }
  - key: container.string.ssoCapacity
    type: const
    priority: P0
    live: localPlayerName
    strategies:
      - extractor: { name: string_sso, in: ClientOp.npcCoord, field: container.string.ssoCapacity, cls: A }
  - key: container.string.heapFlagByte
    type: const
    priority: P0
    live: localPlayerName
    strategies:
      - extractor: { name: string_sso, in: ClientOp.npcCoord, field: container.string.heapFlagByte, cls: A }
  - key: container.string.heapFlagMask
    type: const
    priority: P0
    live: localPlayerName
    strategies:
      - extractor: { name: string_sso, in: ClientOp.npcCoord, field: container.string.heapFlagMask, cls: A }

  - key: enums.events
    type: table
    priority: P1
    doc: Native event ids (ON_GAME_TICK, ON_NPC_LOAD, ...), the P2 event hook contract. NULL_EVENT is -1.
    strategies:
      - enum-table: { match: "^ON_" }

  - key: enums.gameStateTrigger
    type: table
    priority: P1
    doc: osrs.Events.GameStateTrigger, the argument of ON_GAME_STATE_CHANGED callbacks.
    strategies:
      - enum-table: { match: "^(ENTER|LEAVE)_\\w+_STATE$" }

  - key: enums.profileType
    type: table
    priority: P1
    doc: osrs.ClientState.ProfileType, what ClientState.getProfileType returns.
    strategies:
      - enum-table: { match: "^(STANDARD|BETA|DEADMAN|PVP_ARENA|QUEST_SPEEDRUNNING|SEASONAL)$" }
