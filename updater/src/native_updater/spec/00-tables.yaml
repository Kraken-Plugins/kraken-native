# Binding tables, member tables and fingerprints. Anchors are Lua API names that identify each sol2
# registration function; the parser then maps every name in that function to its handler.
tables:
  ClientOp:        { anchors: [npcCoord, locFind] }
  ClientState:     { anchors: [getStatXP, getTickCount] }
  Camera:          { anchors: [getLookAtAngles, getPos] }
  Graphics:        { anchors: [worldToScreenCoord, clientDimensions] }
  Utils:           { anchors: [getCollisionMap] }
  osrs.Entity:     { anchors: [osrs.Entity] }
  osrs.Npc:        { anchors: [osrs.Npc] }
  osrs.Player:     { anchors: [osrs.Player] }
  osrs.NpcType:    { anchors: [osrs.NpcType] }
  osrs.LocType:    { anchors: [osrs.LocType] }
  osrs.ObjType:    { anchors: [osrs.ObjType] }
  osrs.IfType:     { anchors: [osrs.IfType] }
  osrs.InterfaceCoordinates: { anchors: [osrs.InterfaceCoordinates] }
  InterfaceQuery:  { anchors: [retrieveIfGroup, retrieveIfType] }
  CollisionMap:    { anchors: [getBitFlags] }

# Every data-member property registered in these usertypes becomes a key "<struct>.<name>" with the offset
# the client itself registered (class A anchor).
member_tables:
  - { table: osrs.IfType, struct: IfType, priority: P0, live: widgets }
  - { table: osrs.InterfaceCoordinates, struct: InterfaceCoordinates, priority: P1 }

fingerprints:
  NpcLookup:            { callee_of: ClientOp.npcCoord, imm: 0x10000 }
  PlayerLookup:         { callee_of: ClientOp.playerCoord, imm: 0x800 }
  EntityResolver:       { common_callee_of: [osrs.Entity.isInteracting, osrs.Entity.isHealthbarRendered, osrs.Entity.isHeadbarEmpty] }
  ActorWorld:           { callee_of: ClientOp.npcCoord, arg0: sp_result }
  WorldFromCoord:       { callee_of: ClientOp.locFind, arg0: { addr: client } }
  WorldBounds:          { callee_of: "@WorldFromCoord", min_args: 3 }
  TileLookup:           { callee_of: ClientOp.locFind, min_args: 6 }
  ObjPileLookup:        { callee_of: ClientOp.objFind, min_args: 5 }
  VarbitRead:           { callee_of: ClientState.getVarbit, calls: "@ConfigLoader.14", include_self: true }
  ConfigLoaderCore:     { extractor: config_loader_core, cls: C }
  ConfigLoader.6:       { extractor: config_loader_core, field: ConfigLoader.6, cls: C }
  ConfigLoader.9:       { extractor: config_loader_core, field: ConfigLoader.9, cls: C }
  ConfigLoader.10:      { extractor: config_loader_core, field: ConfigLoader.10, cls: C }
  ConfigLoader.12:      { extractor: config_loader_core, field: ConfigLoader.12, cls: C }
  ConfigLoader.13:      { extractor: config_loader_core, field: ConfigLoader.13, cls: C }
  ConfigLoader.14:      { extractor: config_loader_core, field: ConfigLoader.14, cls: C }
  ConfigLoader.16:      { extractor: config_loader_core, field: ConfigLoader.16, cls: C }
  # Login-time varp reset: loops over every varp id (loading its VarPlayerType) and zeroes global.varps[id].
  VarpReset:            { caller_of: "@ConfigLoader.16", refs_global: global.varps }
  # Varc store lookups (sorted vector of {key, variant value, type tag}) and the lower_bound they share.
  VarcIntLookup:        { callee_of: ClientState.getIntegerVarc }
  VarcStringLookup:     { callee_of: ClientState.getStringVarc }
  VarcLowerBound:       { callee_of: "@VarcIntLookup" }
  SetSequence:          { extractor: set_sequence, field: SetSequence, cls: C }
  ActorCtor:            { extractor: actor_ctor, field: ActorCtor, cls: D }
  NpcUpdateDecoder:     { caller_of: "@SetSequence", calls: "@ConfigLoader.9", unique: false }
  OperatorNew:          { extractor: operator_new }
  LocTagToId:           { extractor: scene_grid, field: LocTagToId, cls: A }
  TileGameObjectLookup: { extractor: scene_grid, field: TileGameObjectLookup, cls: A }
  ObjPileTile:          { extractor: obj_pile_grid, field: ObjPileTile, cls: A }
  WorldToScreen:        { binding: Graphics.worldToScreenCoord }
  ProjectionCore:       { callee_of: "@WorldToScreen", min_args: 7 }
  # The rescaler WorldToScreen calls with the renderer block (renderer + 0x10): canvas and screen sizes.
  ScreenRescale:        { callee_of: "@WorldToScreen", arg0: { addr: { field: { of: client, key: Client.renderer } } } }
  # The renderer constructor: the function that builds the projection object and its holder (see renderer_layout).
  RendererCtor:         { extractor: renderer_layout }
  # The walk core that lineOfWalk runs on a collision record (x, z, x2, z2).
  CollisionWalkCore:    { callee_of: CollisionMap.lineOfWalk }
  # The flag accessor CollisionMap:getBitFlags. The binding parser pairs its Lua name with the wrong handler in the
  # CollisionMap table; the handler behind the name CollisionMap.osrs is the accessor.
  CollisionBitFlags:    { binding: CollisionMap.osrs }
  ActorNameGetter:      { callee_of: ClientOp.npcName, arg0: sp_result }
  InvLookupIds:         { callee_of: ClientOp.invGetObjId }
  InvLookupCounts:      { callee_of: ClientOp.invGetNum }
  # js5 group loader: what the loader core calls (with the archive) for a group whose files aren't loaded yet.
  ConfigGroupLoader:    { callee_of: "@ConfigLoaderCore", arg0: arg0 }
  # The local player as ClientOp.coord finds it: in the world the client says it is in (Client.localPlayerWorldId).
  LocalPlayer:          { callee_of: ClientOp.coord, arg0: client }
  LocalPlayerWorld:     { callee_of: "@LocalPlayer", arg0: arg0 }
  # Ground height at a fine position (FineCoord.y): entry(plane, world, x, z, ...) -> height(world, x, z, plane), its
  # bilinear part (the one weighting by 128 - fraction) and that part's corner-height and under-a-bridge helpers.
  TileHeightEntry:      { callee_of: ClientOp.npcCoordFine, min_args: 5 }
  TileHeight:           { callee_of: "@TileHeightEntry" }
  TileHeightBilinear:   { callee_of: "@TileHeight", arg0: arg0, imm: 0x80 }
  TileCornerHeight:     { callee_of: "@TileHeightBilinear", arg0: { field: { of: arg0, key: World.scene } } }
  TileBridgeCheck:      { callee_of: "@TileHeightBilinear", arg0: arg0 }
  # The update a head bar shows at a cycle: isHeadbarEmpty's callee that takes the head bar.
  HeadbarUpdate:        { callee_of: osrs.Entity.isHeadbarEmpty, arg0: { field: { of: { field: { of: sp_result, key: Actor.headbars } }, key: container.list.node.value } } }
  # Multi-NPC transform: the NPC name getter's callee that reads a varbit to pick the child type.
  MultiNpcResolve:      { callee_of: "@ActorNameGetter", calls: "@VarbitRead" }
  LocalFollowerCheck:   { callee_of: osrs.Npc.isLocalFollower, arg0: client }
  # Friend, friends-chat, clan and ignore checks. Each osrs.Player method calls one helper that caches its answer on
  # the player; the friend and friends-chat helpers work it out from name lists (two string-keyed hash tables each).
  PlayerIsOnlineFriend: { callee_of: osrs.Player.isOnlineFriend }
  PlayerIsFriendChat:   { callee_of: osrs.Player.isFriendChat }
  PlayerIsGroup:        { callee_of: osrs.Player.isGroup }
  PlayerFriendCompute:  { callee_of: "@PlayerIsOnlineFriend" }
  PlayerFriendChatCompute: { callee_of: "@PlayerIsFriendChat" }
  NameListContains:     { callee_of: osrs.Player.isIgnored }
  NameTableFind:        { callee_of: "@PlayerFriendChatCompute" }
  NameHash:             { callee_of: "@NameTableFind", imm: 0x1000193 }      # FNV-1 over the normalised name
  # The friend lookups by current and by previous name; both return the node's value, so either will do.
  FriendListFind:       { callee_of: "@PlayerFriendCompute", calls: "@NameTableFind", unique: false }
  # Interface store: component (group << 16 | index) -> its slot, and a component's dynamic child by sub id. The parent
  # getter's helper calls the child lookup with the parent's id and sub id; the children getter's helper lists them.
  IfStoreLookup:        { common_callee_of: [InterfaceQuery.retrieveIfType, osrs.IfType.staticParent] }
  IfParent:             { callee_of: osrs.IfType.parent, min_size: 32 }
  IfStoreChild:         { callee_of: "@IfParent", calls: "@IfStoreLookup" }
  IfChildren:           { callee_of: osrs.IfType.children }
  # The op names getter copies the component (a big copy constructor) and reads the copy in this small helper.
  IfOpNames:            { callee_of: osrs.IfType.opNames, max_size: 0x400 }
  # The layer drawer: draws a static layer's children, then the interface opened in it (Client.subInterfaces). It also
  # draws the FPS counter, so it is the one function that uses the counter's format string.
  IfDrawLayer:          { references: "%s:%0.1f", refs_global: global.cycle }
