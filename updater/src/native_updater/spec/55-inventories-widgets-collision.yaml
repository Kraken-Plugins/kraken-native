keys:
  # Inventories: a global hash table keyed by inventory id. Each node holds two eastl::vector<int>: item ids and counts.
  - key: global.inventories.buckets
    type: ptr<ptr<Inventory>[]>
    priority: P0
    live: inventories
    strategies:
      - getter: { in: "@InvLookupIds", kind: global, size: ptr, select: { used_as_index_base: true } }
      - getter: { in: "@InvLookupCounts", kind: global, size: ptr, select: { used_as_index_base: true } }
  - key: global.inventories.bucketCount
    type: i64
    priority: P0
    live: inventories
    strategies:
      - getter: { in: "@InvLookupIds", kind: global, size: ptr, select: { div_operand: true } }
      - getter: { in: "@InvLookupCounts", kind: global, size: ptr, select: { div_operand: true } }
  - key: Inventory.id
    type: i32
    priority: P0
    live: inventories
    strategies:
      - getter: { in: "@InvLookupIds", base: hash_node, load: i32, select: { used_in_cmp: true } }
      - getter: { in: "@InvLookupCounts", base: hash_node, load: i32, select: { used_in_cmp: true } }
  - key: Inventory.next
    type: ptr<Inventory>
    priority: P0
    live: inventories
    strategies:
      - getter: { in: "@InvLookupIds", base: hash_node, load: ptr, select: { used_in_cmp: true } }
      - getter: { in: "@InvLookupCounts", base: hash_node, load: ptr, select: { used_in_cmp: true } }
  - key: Inventory.ids
    type: eastl.vector<i32>.begin
    priority: P0
    live: inventories
    strategies:
      - getter: { in: "@InvLookupIds", base: hash_node, load: ptr, select: { used_as_index_base: true } }
  - key: Inventory.idsEnd
    type: eastl.vector<i32>.end
    priority: P0
    live: inventories
    strategies:
      - getter: { in: "@InvLookupIds", base: hash_node, load: ptr, select: { combined_with: { key: Inventory.ids } } }
    invariants:
      - equals: "Inventory.ids + 8"
  - key: Inventory.counts
    type: eastl.vector<i32>.begin
    priority: P0
    live: inventories
    strategies:
      - getter: { in: "@InvLookupCounts", base: hash_node, load: ptr, select: { used_as_index_base: true } }
  - key: Inventory.countsEnd
    type: eastl.vector<i32>.end
    priority: P0
    live: inventories
    strategies:
      - getter: { in: "@InvLookupCounts", base: hash_node, load: ptr, select: { combined_with: { key: Inventory.counts } } }
    invariants:
      - equals: "Inventory.counts + 8"

  # Interface groups: hash_map<int groupId, IfGroup> on the Client. The node keeps the 32-byte value inline
  # (key at 0, value at 4, next at 0x28), unlike the shared_ptr maps.
  - key: Client.interfaces.buckets
    type: ptr
    priority: P0
    live: widgets
    strategies:
      - hash-map: { in: InterfaceQuery.retrieveIfGroup, base: client, part: buckets }
  - key: Client.interfaces.bucketCount
    type: i32
    priority: P0
    live: widgets
    strategies:
      - hash-map: { in: InterfaceQuery.retrieveIfGroup, base: client, part: count }
    invariants:
      - equals: "Client.interfaces.buckets + 8"
  - key: IfGroupNode.key
    type: i32
    priority: P0
    live: widgets
    strategies:
      - hash-map: { in: InterfaceQuery.retrieveIfGroup, base: client, part: node_key }
  - key: IfGroupNode.next
    type: ptr
    priority: P0
    live: widgets
    strategies:
      - hash-map: { in: InterfaceQuery.retrieveIfGroup, base: client, part: node_next }
  - key: IfGroupNode.value
    type: IfGroup(32 bytes)
    priority: P1
    doc: Copied out as two 16-byte blocks from node+4 by retrieveIfGroup; layout of the group record not mapped yet.
    strategies:
      - getter: { in: InterfaceQuery.retrieveIfGroup, base: hash_node, load: any, select: { nth: 1, min: 4 } }

  # Collision maps: array of 40-byte records hanging off the Scene; the flag bitmap inside each record is not mapped yet.
  - key: Scene.collisionMaps
    type: ptr<CollisionMapRecord[]>
    priority: P1
    doc: Indexed by plane in Utils.getCollisionMap. P0 in the catalog, but the flag array itself still needs mapping.
    strategies:
      - getter: { in: Utils.getCollisionMap, base: { field: { of: { field: { of: client, key: Client.topLevelWorld } }, key: World.scene } }, load: ptr, select: { used_as_index_base: true } }
  - key: CollisionMapRecord.stride
    type: const
    priority: P1
    strategies:
      - getter: { in: Utils.getCollisionMap, kind: stride, base: { field: { of: { field: { of: { field: { of: client, key: Client.topLevelWorld } }, key: World.scene } }, key: Scene.collisionMaps } } }

  # Map loader: the current map base tile (world coordinates). ClientOp.objFind rebases an absolute coordinate by it:
  # z is subtracted first, then x, so the two i32 loads off the loader are told apart by their order.
  - key: Client.mapLoader
    type: ptr<MapLoader>
    priority: P1
    doc: Pointer to the map loader state; the base tile that coordinates are rebased by lives in it.
    strategies:
      - getter: { in: ClientOp.objFind, base: client, load: ptr, select: { used_as_base: true } }
  - key: MapLoader.baseX
    type: i32
    priority: P1
    doc: Current map base tile x (world coordinates).
    strategies:
      - getter: { in: ClientOp.objFind, base: { field: { of: client, key: Client.mapLoader } }, load: i32, select: { nth: 1 } }
  - key: MapLoader.baseZ
    type: i32
    priority: P1
    doc: Current map base tile z (world coordinates).
    strategies:
      - getter: { in: ClientOp.objFind, base: { field: { of: client, key: Client.mapLoader } }, load: i32, select: { nth: 0 } }
    invariants:
      - equals: "MapLoader.baseX + 4"

  # The record vector runs from Scene.collisionMaps (begin) to this field (end): Utils.getCollisionMaps walks it.
  - key: Scene.collisionMapsEnd
    type: ptr<CollisionMapRecord[]>
    priority: P1
    doc: End of the collision map record vector; the walk over the records stops here.
    strategies:
      - getter: { in: Utils.getCollisionMaps, base: { field: { of: { field: { of: client, key: Client.topLevelWorld } }, key: World.scene } }, load: ptr, select: { cmp_with: { key: Scene.collisionMaps } } }
    invariants:
      - equals: "Scene.collisionMaps + 8"

  # Record fields: the walk and line-of-sight cores (CollisionWalkCore) and the flag accessor (CollisionBitFlags) read
  # the same record. Origins are subtracted from the coordinates, sizes bound the rebased coordinates, and flags sit
  # behind a pointer to per-x columns, each a pointer at +columnData with columnStride bytes per x.
  - key: CollisionMapRecord.originX
    type: i32
    priority: P1
    doc: Map origin x, subtracted from the x coordinate before indexing the flags.
    strategies:
      - extractor: { name: collision_record, field: CollisionMapRecord.originX, cls: A }
  - key: CollisionMapRecord.originZ
    type: i32
    priority: P1
    doc: Map origin z, subtracted from the z coordinate before indexing the flags.
    strategies:
      - extractor: { name: collision_record, field: CollisionMapRecord.originZ, cls: A }
    invariants:
      - equals: "CollisionMapRecord.originX + 4"
  - key: CollisionMapRecord.sizeX
    type: i32
    priority: P1
    doc: Map width in tiles; the rebased x must stay below it.
    strategies:
      - extractor: { name: collision_record, field: CollisionMapRecord.sizeX, cls: A }
  - key: CollisionMapRecord.sizeZ
    type: i32
    priority: P1
    doc: Map depth in tiles; the rebased z must stay below it.
    strategies:
      - extractor: { name: collision_record, field: CollisionMapRecord.sizeZ, cls: A }
    invariants:
      - equals: "CollisionMapRecord.sizeX + 4"
  - key: CollisionMapRecord.flags
    type: ptr<CollisionColumn[]>
    priority: P1
    doc: Pointer to the array of per-x columns of flag pointers.
    strategies:
      - getter: { in: "@CollisionBitFlags", base: arg0, load: ptr, select: { used_as_base: true } }
      - extractor: { name: collision_record, field: CollisionMapRecord.flags, cls: A }
  - key: CollisionMapRecord.columnStride
    type: const
    priority: P1
    doc: Bytes per x step in the column array.
    strategies:
      - getter: { in: "@CollisionBitFlags", kind: stride, base: { field: { of: arg0, offset: 0x20 } } }
      - extractor: { name: collision_record, field: CollisionMapRecord.columnStride, cls: A }
  - key: CollisionMapRecord.columnData
    type: const
    priority: P1
    doc: Offset of the flag array pointer inside each column entry.
    strategies:
      - getter: { in: "@CollisionBitFlags", base: { field: { of: arg0, offset: 0x20 } }, load: ptr, select: { index_scale: 8 } }
      - extractor: { name: collision_record, field: CollisionMapRecord.columnData, cls: A }
