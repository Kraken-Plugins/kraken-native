keys:
  # Inventories: a global hash table keyed by inventory id. Each node holds two eastl::vector<int>: item ids and counts.
  - key: global.inventories.buckets
    type: ptr<ptr<Inventory>[]>
    priority: P0
    live: inventories
    strategies:
      - getter: { in: "@InvLookupIds", kind: global, size: ptr, select: { used_as_index_base: true } }
      - getter: { in: "@InvLookupCounts", kind: global, size: ptr, select: { used_as_index_base: true } }
  - key: global.inventories.bucketCount
    type: i64
    priority: P0
    live: inventories
    strategies:
      - getter: { in: "@InvLookupIds", kind: global, size: ptr, select: { div_operand: true } }
      - getter: { in: "@InvLookupCounts", kind: global, size: ptr, select: { div_operand: true } }
  - key: Inventory.id
    type: i32
    priority: P0
    live: inventories
    strategies:
      - getter: { in: "@InvLookupIds", base: hash_node, load: i32, select: { used_in_cmp: true } }
      - getter: { in: "@InvLookupCounts", base: hash_node, load: i32, select: { used_in_cmp: true } }
  - key: Inventory.next
    type: ptr<Inventory>
    priority: P0
    live: inventories
    strategies:
      - getter: { in: "@InvLookupIds", base: hash_node, load: ptr, select: { used_in_cmp: true } }
      - getter: { in: "@InvLookupCounts", base: hash_node, load: ptr, select: { used_in_cmp: true } }
  - key: Inventory.ids
    type: eastl.vector<i32>.begin
    priority: P0
    live: inventories
    strategies:
      - getter: { in: "@InvLookupIds", base: hash_node, load: ptr, select: { used_as_index_base: true } }
  - key: Inventory.idsEnd
    type: eastl.vector<i32>.end
    priority: P0
    live: inventories
    strategies:
      - getter: { in: "@InvLookupIds", base: hash_node, load: ptr, select: { combined_with: { key: Inventory.ids } } }
    invariants:
      - equals: "Inventory.ids + 8"
  - key: Inventory.counts
    type: eastl.vector<i32>.begin
    priority: P0
    live: inventories
    strategies:
      - getter: { in: "@InvLookupCounts", base: hash_node, load: ptr, select: { used_as_index_base: true } }
  - key: Inventory.countsEnd
    type: eastl.vector<i32>.end
    priority: P0
    live: inventories
    strategies:
      - getter: { in: "@InvLookupCounts", base: hash_node, load: ptr, select: { combined_with: { key: Inventory.counts } } }
    invariants:
      - equals: "Inventory.counts + 8"

  # Interface groups: hash_map<int groupId, IfGroup> on the Client. The node keeps the 32-byte value inline
  # (key at 0, value at 4, next at 0x28), unlike the shared_ptr maps.
  - key: Client.interfaces.buckets
    type: ptr
    priority: P0
    live: widgets
    strategies:
      - hash-map: { in: InterfaceQuery.retrieveIfGroup, base: client, part: buckets }
  - key: Client.interfaces.bucketCount
    type: i32
    priority: P0
    live: widgets
    strategies:
      - hash-map: { in: InterfaceQuery.retrieveIfGroup, base: client, part: count }
    invariants:
      - equals: "Client.interfaces.buckets + 8"
  - key: IfGroupNode.key
    type: i32
    priority: P0
    live: widgets
    strategies:
      - hash-map: { in: InterfaceQuery.retrieveIfGroup, base: client, part: node_key }
  - key: IfGroupNode.next
    type: ptr
    priority: P0
    live: widgets
    strategies:
      - hash-map: { in: InterfaceQuery.retrieveIfGroup, base: client, part: node_next }
  - key: IfGroupNode.value
    type: IfGroup(32 bytes)
    priority: P1
    doc: Copied out as two 16-byte blocks from node+4 by retrieveIfGroup; layout of the group record not mapped yet.
    strategies:
      - getter: { in: InterfaceQuery.retrieveIfGroup, base: hash_node, load: any, select: { nth: 1, min: 4 } }

  # Sub-interfaces: hash_map<int componentId, SubInterface> on the Client, from a component to the group opened in it
  # (what IF_OPENSUB fills). The layer drawer looks a static layer's id up in it after drawing the layer's children and
  # passes the group it finds to the group drawer. The node keeps the value inline: key at 0, group at 4, next at 0x10.
  - key: Client.subInterfaces.buckets
    type: ptr
    priority: P1
    live: subInterfaces
    strategies:
      - hash-map: { in: "@IfDrawLayer", base: arg0, part: buckets }
  - key: Client.subInterfaces.bucketCount
    type: i32
    priority: P1
    live: subInterfaces
    strategies:
      - hash-map: { in: "@IfDrawLayer", base: arg0, part: count }
    invariants:
      - equals: "Client.subInterfaces.buckets + 8"
  - key: SubInterfaceNode.key
    type: i32
    priority: P1
    live: subInterfaces
    doc: The component's packed id (group << 16 | index).
    strategies:
      - hash-map: { in: "@IfDrawLayer", base: arg0, part: node_key }
  - key: SubInterfaceNode.next
    type: ptr
    priority: P1
    live: subInterfaces
    strategies:
      - hash-map: { in: "@IfDrawLayer", base: arg0, part: node_next }
  - key: SubInterfaceNode.group
    type: i32
    priority: P1
    live: subInterfaces
    doc: The group opened in the component; the layer drawer passes it to the group drawer.
    strategies:
      - getter: { in: "@IfDrawLayer", base: hash_node, load: i32, select: { passed_to: { arg: 1 } } }

  # Interface store: every loaded group's components, by group id. groups[g] is an array of jag::shared_ptr<IfType>
  # slots, one per static component; a static component keeps its dynamic children in a slot array of its own.
  - key: Client.interfaceStore
    type: ptr<IfStore>
    priority: P1
    doc: The interface store; retrieveIfType looks components up in it.
    strategies:
      - getter: { in: InterfaceQuery.retrieveIfType, base: client, load: ptr }
      - getter: { in: osrs.IfType.staticParent, base: client, load: ptr }
  - key: IfStore.groupCount
    type: i64
    priority: P1
    doc: Number of groups in the store; a group id at or past it is a miss.
    strategies:
      - getter: { in: "@IfStoreLookup", base: arg0, load: i64, select: { used_in_cmp: true } }
  - key: IfStore.groups
    type: ptr<IfStoreGroup[]>
    priority: P1
    strategies:
      - getter: { in: "@IfStoreLookup", base: arg0, load: ptr, select: { used_as_index_base: true } }
  - key: IfStoreGroup.stride
    type: const
    priority: P1
    strategies:
      - getter: { in: "@IfStoreLookup", kind: stride, base: { field: { of: arg0, key: IfStore.groups } } }
  - key: IfStoreGroup.count
    type: i64
    priority: P1
    doc: Number of component slots; 0 until the client loads the group.
    strategies:
      - getter: { in: "@IfStoreLookup", base: { field: { of: arg0, key: IfStore.groups } }, load: i64, select: { indexed: true, used_in_cmp: true } }
  - key: IfStoreGroup.slots
    type: ptr<shared_ptr<IfType>[]>
    priority: P1
    strategies:
      - getter: { in: "@IfStoreLookup", base: hash_node, load: ptr, select: { returned: true } }
  - key: IfStoreGroup.slotStride
    type: const
    priority: P1
    strategies:
      - getter: { in: "@IfStoreLookup", kind: stride, base: { field: { of: hash_node, key: IfStoreGroup.slots } } }

  # osrs.IfType getters that are lambdas rather than data members (the binding parser follows them to the lambda,
  # which reads its component through sol_self).
  - key: IfType.packedId
    type: i32
    priority: P1
    doc: group << 16 | component index; a dynamic component carries its static root's. id reads the high half.
    strategies:
      - getter: { in: osrs.IfType.componentIndex, base: sol_self, load: u16 }
      - getter: { in: osrs.IfType.id, base: sol_self, load: i16, add: -2 }
  - key: IfType.layerSubId
    type: i32
    priority: P1
    doc: Sub id of a dynamic component's direct parent under the same static root; -1 when that parent is the root.
    strategies:
      - getter: { in: "@IfParent", base: arg0, load: i32, select: { passed_to: { fn: "@IfStoreChild", arg: 2 } } }
  - key: IfType.type
    type: i32
    priority: P1
    doc: InterfaceQuery.IfTypes (0 LAYER, 3 RECT, 4 TEXT, 5 GRAPHIC, 6 MODEL...). Only a LAYER has children.
    strategies:
      - getter: { in: "@IfChildren", base: arg2, load: i32, select: { compared_with: 0 } }
  - key: IfType.sourceName
    type: eastl.string
    priority: P2
    strategies:
      - getter: { in: osrs.IfType.sourceName, base: sol_self, load: ptr }
  - key: IfType.aspectRatio
    type: i32[2]
    priority: P2
    strategies:
      - getter: { in: osrs.IfType.aspectRatio, base: sol_self, load: i32, select: { lowest: true } }
  - key: IfType.scrollPos
    type: i32[2]
    priority: P1
    strategies:
      - getter: { in: osrs.IfType.scrollPos, base: sol_self, load: i32, select: { lowest: true } }
  - key: IfType.scrollSize
    type: i32[2]
    priority: P1
    strategies:
      - getter: { in: osrs.IfType.scrollSize, base: sol_self, load: i32, select: { lowest: true } }
  - key: IfType.colour
    type: i32
    priority: P1
    doc: 0xAARRGGBB, as every colour field.
    strategies:
      - getter: { in: osrs.IfType.colour, base: sol_self, load: i32 }
  - key: IfType.colour2
    type: i32
    priority: P2
    strategies:
      - getter: { in: osrs.IfType.colour2, base: sol_self, load: i32 }
  - key: IfType.colourOver
    type: i32
    priority: P2
    strategies:
      - getter: { in: osrs.IfType.colourOver, base: sol_self, load: i32 }
  - key: IfType.shadowColour
    type: i32
    priority: P2
    strategies:
      - getter: { in: osrs.IfType.shadowColour, base: sol_self, load: i32 }
  - key: IfType.graphicURL
    type: eastl.string
    priority: P2
    strategies:
      - getter: { in: osrs.IfType.graphicURL, base: sol_self, load: ptr }
  - key: IfType.text
    type: eastl.string
    priority: P1
    strategies:
      - getter: { in: osrs.IfType.text, base: sol_self, load: ptr }
  - key: IfType.text2
    type: eastl.string
    priority: P2
    strategies:
      - getter: { in: osrs.IfType.text2, base: sol_self, load: ptr }
  - key: IfType.baseOpName
    type: eastl.string
    priority: P1
    strategies:
      - getter: { in: osrs.IfType.baseOpName, base: sol_self, load: ptr }
  - key: IfType.opCount
    type: i32
    priority: P1
    strategies:
      - getter: { in: "@IfOpNames", base: arg2, load: i32, select: { used_in_cmp: true } }
  - key: IfType.opNames
    type: ptr<eastl.string[]>
    priority: P1
    strategies:
      - getter: { in: "@IfOpNames", base: arg2, load: ptr, select: { used_as_base: true } }
  - key: IfType.dynCount
    type: i64
    priority: P1
    doc: Number of dynamic child slots of a static component.
    strategies:
      - getter: { in: "@IfStoreChild", base: sp_result, load: i64, select: { used_in_cmp: true } }
  - key: IfType.dynSlots
    type: ptr<shared_ptr<IfType>[]>
    priority: P1
    doc: The dynamic child slots, indexed by sub id (IfStoreGroup.slotStride bytes each).
    strategies:
      - getter: { in: "@IfStoreChild", base: sp_result, load: ptr, select: { returned: true } }
  - key: IfType.renderCycle
    type: i32
    priority: P1
    doc: Set to Client.renderCycle when the component is drawn; isRendering compares the two.
    strategies:
      - getter: { in: osrs.IfType.isRendering, base: sol_self, load: i32 }
  - key: Client.renderCycle
    type: i32
    priority: P1
    strategies:
      - getter: { in: osrs.IfType.isRendering, base: client, load: i32 }

  # Collision maps: array of 40-byte records hanging off the Scene; the flag bitmap inside each record is not mapped yet.
  - key: Scene.collisionMaps
    type: ptr<CollisionMapRecord[]>
    priority: P1
    doc: Indexed by plane in Utils.getCollisionMap. P0 in the catalog, but the flag array itself still needs mapping.
    strategies:
      - getter: { in: Utils.getCollisionMap, base: { field: { of: { field: { of: client, key: Client.topLevelWorld } }, key: World.scene } }, load: ptr, select: { used_as_index_base: true } }
  - key: CollisionMapRecord.stride
    type: const
    priority: P1
    strategies:
      - getter: { in: Utils.getCollisionMap, kind: stride, base: { field: { of: { field: { of: { field: { of: client, key: Client.topLevelWorld } }, key: World.scene } }, key: Scene.collisionMaps } } }

  # Map loader: the current map base tile (world coordinates). ClientOp.objFind rebases an absolute coordinate by it:
  # z is subtracted first, then x, so the two i32 loads off the loader are told apart by their order.
  - key: Client.mapLoader
    type: ptr<MapLoader>
    priority: P1
    doc: Pointer to the map loader state; the base tile that coordinates are rebased by lives in it.
    strategies:
      - getter: { in: ClientOp.objFind, base: client, load: ptr, select: { used_as_base: true } }
  - key: MapLoader.baseX
    type: i32
    priority: P1
    doc: Current map base tile x (world coordinates).
    strategies:
      - getter: { in: ClientOp.objFind, base: { field: { of: client, key: Client.mapLoader } }, load: i32, select: { nth: 1 } }
  - key: MapLoader.baseZ
    type: i32
    priority: P1
    doc: Current map base tile z (world coordinates).
    strategies:
      - getter: { in: ClientOp.objFind, base: { field: { of: client, key: Client.mapLoader } }, load: i32, select: { nth: 0 } }
    invariants:
      - equals: "MapLoader.baseX + 4"

  # The record vector runs from Scene.collisionMaps (begin) to this field (end): Utils.getCollisionMaps walks it.
  - key: Scene.collisionMapsEnd
    type: ptr<CollisionMapRecord[]>
    priority: P1
    doc: End of the collision map record vector; the walk over the records stops here.
    strategies:
      - getter: { in: Utils.getCollisionMaps, base: { field: { of: { field: { of: client, key: Client.topLevelWorld } }, key: World.scene } }, load: ptr, select: { cmp_with: { key: Scene.collisionMaps } } }
    invariants:
      - equals: "Scene.collisionMaps + 8"

  # Record fields: the walk and line-of-sight cores (CollisionWalkCore) and the flag accessor (CollisionBitFlags) read
  # the same record. Origins are subtracted from the coordinates, sizes bound the rebased coordinates, and flags sit
  # behind a pointer to per-x columns, each a pointer at +columnData with columnStride bytes per x.
  - key: CollisionMapRecord.originX
    type: i32
    priority: P1
    doc: Map origin x, subtracted from the x coordinate before indexing the flags.
    strategies:
      - extractor: { name: collision_record, field: CollisionMapRecord.originX, cls: A }
  - key: CollisionMapRecord.originZ
    type: i32
    priority: P1
    doc: Map origin z, subtracted from the z coordinate before indexing the flags.
    strategies:
      - extractor: { name: collision_record, field: CollisionMapRecord.originZ, cls: A }
    invariants:
      - equals: "CollisionMapRecord.originX + 4"
  - key: CollisionMapRecord.sizeX
    type: i32
    priority: P1
    doc: Map width in tiles; the rebased x must stay below it.
    strategies:
      - extractor: { name: collision_record, field: CollisionMapRecord.sizeX, cls: A }
  - key: CollisionMapRecord.sizeZ
    type: i32
    priority: P1
    doc: Map depth in tiles; the rebased z must stay below it.
    strategies:
      - extractor: { name: collision_record, field: CollisionMapRecord.sizeZ, cls: A }
    invariants:
      - equals: "CollisionMapRecord.sizeX + 4"
  - key: CollisionMapRecord.flags
    type: ptr<CollisionColumn[]>
    priority: P1
    doc: Pointer to the array of per-x columns of flag pointers.
    strategies:
      - getter: { in: "@CollisionBitFlags", base: arg0, load: ptr, select: { used_as_base: true } }
      - extractor: { name: collision_record, field: CollisionMapRecord.flags, cls: A }
  - key: CollisionMapRecord.columnStride
    type: const
    priority: P1
    doc: Bytes per x step in the column array.
    strategies:
      - getter: { in: "@CollisionBitFlags", kind: stride, base: { field: { of: arg0, offset: 0x20 } } }
      - extractor: { name: collision_record, field: CollisionMapRecord.columnStride, cls: A }
  - key: CollisionMapRecord.columnData
    type: const
    priority: P1
    doc: Offset of the flag array pointer inside each column entry.
    strategies:
      - getter: { in: "@CollisionBitFlags", base: { field: { of: arg0, offset: 0x20 } }, load: ptr, select: { index_scale: 8 } }
      - extractor: { name: collision_record, field: CollisionMapRecord.columnData, cls: A }
