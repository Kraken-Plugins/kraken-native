# Functions that perform a Lua API operation (Graphics.worldToScreenCoord, the getNpcObj/getPlayerObj lookups,
# animations, type lookups by id, getVarbit), for the planned in-process backend to call. Helper functions that only
# locate other values stay fingerprints (00-tables.yaml); their RVAs are in the build's analysis.json.
keys:
  - key: functions.worldToScreen
    type: "void(const int world[3], float out[2], ...)"
    priority: P0
    live: projection
    strategies:
      - fingerprint: { name: WorldToScreen }
  - key: functions.npcLookup
    type: "shared_ptr<Npc>*(out, int id, WorldManager*)"
    priority: P0
    live: npcs
    strategies:
      - fingerprint: { name: NpcLookup }
  - key: functions.playerLookup
    type: fn
    priority: P0
    live: players
    strategies:
      - fingerprint: { name: PlayerLookup }
  - key: functions.setSequence
    type: "void(Actor*, int seq, int delay)"
    priority: P0
    live: anim
    strategies:
      - fingerprint: { name: SetSequence }
  - key: functions.locTypeLoader
    type: fn
    priority: P1
    strategies:
      - fingerprint: { name: ConfigLoader.6 }
  - key: functions.npcTypeLoader
    type: fn
    priority: P1
    strategies:
      - fingerprint: { name: ConfigLoader.9 }
  - key: functions.objTypeLoader
    type: fn
    priority: P1
    strategies:
      - fingerprint: { name: ConfigLoader.10 }
  - key: functions.varbitRead
    type: "int(int varbitId)"
    priority: P1
    strategies:
      - fingerprint: { name: VarbitRead }
